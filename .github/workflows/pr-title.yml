name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            task
            docs
            style
          requireScope: false
          subjectPattern: ^.+\(#\d+\)$
          subjectPatternError: |
            PR title must end with an issue reference: e.g. "feat: add global search (#6)"
            Allowed types: feat, fix, task, docs, style
