name: E2E Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start mock API server
        run: node e2e/mock-server.mjs &

      - name: Wait for mock API server
        run: until curl -sf http://localhost:3333/apps > /dev/null; do sleep 1; done

      - name: Build app (with mock API URLs)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3333/apps
          NEXT_PUBLIC_METRICS_URL: http://localhost:3333/metrics

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
